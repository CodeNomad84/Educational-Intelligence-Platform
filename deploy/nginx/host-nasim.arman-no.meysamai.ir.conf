# Host reverse proxy for the girls' app: nasim.arman-no.meysamai.ir
# ------------------------------------------------------------------
# APPLY MANUALLY (needs root) — this file is NOT used by Docker.
#
# The only upstream is the Docker edge gateway on 127.0.0.1:8080, which routes by the
# Host header to `frontend_women` (ADR-0015). Static files are served by that gateway too.
#
# This is the HTTP-only block first, so Certbot's nginx plugin can prove the domain and
# then add the `listen 443 ssl` block + certificate (and turn this port-80 block into an
# HTTPS redirect) — exactly how arman-no.meysamai.ir / demo-eip.meysamai.ir were set up.
server {
    listen 80;
    listen [::]:80;
    server_name nasim.arman-no.meysamai.ir;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
