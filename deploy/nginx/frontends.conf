# Edge gateway for the two TanStack Start apps (ADR-0014 decision 2, ADR-0015).
# Rendered from /etc/nginx/templates/frontends.conf.template by the official nginx image entrypoint
# (envsubst): MEN_HOST / WOMEN_HOST come from the compose environment with loopback defaults.
# One origin per app: the browser calls /api/... on its own host, so no CORS entry is needed.
#
# Server profile: the school's TLS proxy terminates 443 and forwards men.<domain> / women.<domain>
# to this gateway with the original Host header preserved (docs/DEPLOYMENT.md §3b).

limit_req_zone $binary_remote_addr zone=eip_auth:10m rate=10r/m;   # login/token/admin (Django throttles too)
limit_req_zone $binary_remote_addr zone=eip_all:10m rate=20r/s;

# Unknown Host headers get nothing: no default app behind an arbitrary name.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { return 404; }
}

server {
    listen 80;
    server_name ${MEN_HOST};
    server_tokens off;
    client_max_body_size 10m;
    limit_req zone=eip_all burst=40 nodelay;

    # Responses generated by nginx itself are not covered by Django's middleware.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location = /healthz { access_log off; return 200 "ok\n"; }
    location /media/ { return 404; }              # uploads are never served directly

    location ~ ^/(login|api/token|admin/login)/ {
        limit_req zone=eip_auth burst=5 nodelay;
        include /etc/nginx/eip_proxy.conf;
    }
    location /api/ { include /etc/nginx/eip_proxy.conf; }
    location /admin/ { include /etc/nginx/eip_proxy.conf; }
    location /static/ { include /etc/nginx/eip_proxy.conf; }

    # Django HTML product routes (the 6-role pages, docs/manuals/*). The two React
    # apps are still demo dashboards at `/` (ADR-0014 presentation layer, Phase 3),
    # so until they implement these views the complete, tested Django product is
    # served here. Matched before `location /` (regex wins over the prefix catch-all),
    # so /school, /dashboard, /students/<id>/360, /teacher, /counselor, /grade,
    # /mission, /exams, /rules, /assistant, /me render on hard reload instead of 404.
    location ~ ^/(school|students|teacher|counselor|grade|dashboard|me|account|notifications|alerts|interventions|modules|platform|mission|exams|rules|assistant|logout)(/|$) {
        include /etc/nginx/eip_proxy.conf;
    }

    location / {
        # SPA/SSR fallback (ADR-0015 D1): the app is a TanStack Start + Nitro
        # `node-server` build, NOT a static SPA behind a filesystem `root`.
        # The Node server renders the document (and any client-side route) itself,
        # so the classic `try_files $uri $uri/ /index.html;` is intentionally
        # absent — there is no static index.html on disk and `try_files` would
        # 404 every deep link before the proxy ever sees it. Every unmatched
        # path is forwarded verbatim to the Node server, which answers the SSR
        # shell or the framework 404.
        proxy_pass http://frontend_men:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name ${WOMEN_HOST};
    server_tokens off;
    client_max_body_size 10m;
    limit_req zone=eip_all burst=40 nodelay;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location = /healthz { access_log off; return 200 "ok\n"; }
    location /media/ { return 404; }

    location ~ ^/(login|api/token|admin/login)/ {
        limit_req zone=eip_auth burst=5 nodelay;
        include /etc/nginx/eip_proxy.conf;
    }
    location /api/ { include /etc/nginx/eip_proxy.conf; }
    location /admin/ { include /etc/nginx/eip_proxy.conf; }
    location /static/ { include /etc/nginx/eip_proxy.conf; }

    # Django HTML product routes (the 6-role pages, docs/manuals/*) — same as the
    # men block: served from Django until the React presentation layer implements
    # these views (Phase 3). Regex wins over `location /` so deep links render.
    location ~ ^/(school|students|teacher|counselor|grade|dashboard|me|account|notifications|alerts|interventions|modules|platform|mission|exams|rules|assistant|logout)(/|$) {
        include /etc/nginx/eip_proxy.conf;
    }

    location / {
        # SPA/SSR fallback (ADR-0015 D1): same reasoning as the men block — the
        # Nitro `node-server` renders the app shell; `try_files` is intentionally
        # omitted (no static index.html on disk). Forward every path verbatim.
        proxy_pass http://frontend_women:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
