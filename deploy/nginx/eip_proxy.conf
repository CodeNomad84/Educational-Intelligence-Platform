# Shared upstream for the gateway's Django routes (included by deploy/nginx/frontends.conf).
# Gunicorn is reachable only over the compose `edge` network; it publishes no port of its own (ADR-0015).
proxy_pass http://django:8000;
# $http_host (not $host) keeps the client's port: Django compares the browser's Origin
# (http://men.localhost:8080) with request.get_host(), and the CSRF check fails if the port is stripped.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
# The real client scheme. This stack terminates no TLS (decision D7=a), so Django's SECURE_SSL_REDIRECT is
# set to 0 for the compose profile instead of pretending to be a TLS proxy — claiming `https` here would
# make request.is_secure() disagree with the browser's http Origin and break CSRF on /api/auth/login/.
# In the server profile the outer TLS proxy sends https end-to-end and SECURE_SSL_REDIRECT=1 applies.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;
