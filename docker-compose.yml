# سرویس‌های جدید را اضافه کرده و db را جایگزین sqlite می‌کنیم:


services:
  # ========== Django ==========
  django:
    build: ./django_core
    container_name: django_core
    ports:
      # ADR-0015: the edge gateway on 127.0.0.1:${FRONTEND_HTTP_PORT:-8080} is the entry point.
      # This loopback port is for debugging only; it defaults to 8010 because port 8000 is occupied by
      # another local project on the owner's machine (decision D5, change 0042).
      - "127.0.0.1:${DJANGO_HTTP_PORT:-8010}:8000"
    volumes:
      - ./django_core:/app
      - ./data/static:/app/staticfiles
      - ./data/media:/app/media
    env_file:
      - .env
      - .env.service   # SERVICE_JWT_SECRET (gitignored); shared with FastAPI only
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_started
      fastapi:
        condition: service_started
    # R-04: the runtime connects as the least-privilege role school_app (DML only). Schema changes run in the one-shot `migrate` service.
    command: >
      sh -c "gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 3000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - USE_POSTGRES=True
      - DB_USER=school_app
      - DB_PASSWORD=${DB_APP_PASSWORD:?DB_APP_PASSWORD is required}
      # ADR-0015: the two apps are served from their own host names through the gateway, so Django must
      # accept them. The value from .env (server profile) is kept as the base and the two loopback-era
      # names are appended; set MEN_HOST/WOMEN_HOST to the school's names in production.
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1},${MEN_HOST:-men.localhost},${WOMEN_HOST:-women.localhost}
      # Decision D7=a: the local gateway speaks plain HTTP (no TLS in this stack), so the redirect to https
      # would break /api/ with a 301. The code default stays True; a server deployment MUST set
      # SECURE_SSL_REDIRECT=1 in .env behind the school's TLS proxy.
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-0}
    networks:
      - edge        # gateway + both frontends
      - backend     # postgres, redis, fastapi, celery

  # ========== Migrations (one-shot, the only service that may change the schema) ==========
  migrate:
    build: ./django_core
    container_name: django_migrate
    volumes:
      - ./django_core:/app
      - ./data/static:/app/staticfiles
    env_file:
      - .env
      - .env.service
    depends_on:
      - postgres
    restart: "no"
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - USE_POSTGRES=True
      - DB_USER=school_owner
      - DB_PASSWORD=${DB_OWNER_PASSWORD:?DB_OWNER_PASSWORD is required}
    networks:
      - backend

  # ========== Celery Worker (پردازش پس‌زمینه) ==========
  celery:
    build: ./django_core
    container_name: celery_worker
    volumes:
      - ./django_core:/app
    env_file: .env
    depends_on:
      - postgres
      - redis
    command: celery -A config worker -l info
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_USER=school_app
      - DB_PASSWORD=${DB_APP_PASSWORD:?DB_APP_PASSWORD is required}
    networks:
      - backend

  # ========== Celery Beat (زمان‌بندی کارها) ==========
  celery_beat:
    build: ./django_core
    container_name: celery_beat
    volumes:
      - ./django_core:/app
    env_file: .env
    depends_on:
      - postgres
      - redis
      - celery
    command: celery -A config beat -l info
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_USER=school_app
      - DB_PASSWORD=${DB_APP_PASSWORD:?DB_APP_PASSWORD is required}
    networks:
      - backend

  # ========== FastAPI ==========
  fastapi:
    build: ./fastapi_core
    container_name: fastapi_core
    # NO published port (owner 2026-11-02): FastAPI, including /llm/complete/, is reachable only over the internal compose network
    # ("fastapi:8001"), by Django with the signed service token. For local debugging use `docker compose exec fastapi ...`.
    # A test (fastapi_core/tests/test_exposure.py) fails if a port is published here or nginx proxies to it.
    volumes:
      - ./fastapi_core:/app
      - ./data:/data
    # Deliberately NOT env_file: .env -- FastAPI must not receive Django's SECRET_KEY, the Django
    # database owner password, or other Django-only settings.
    env_file:
      - .env.service   # SERVICE_JWT_SECRET (gitignored)
      - .env.fastapi   # DB_USER / DB_PASSWORD of the least-privilege role `fastapi_user` (gitignored)
      # ADR-0008 / change 0043: AI provider configuration (LLM_PROVIDERS, LLM_SCHOOL_MAP, LLM_DAILY_CAP, LLM_KEY_*).
      # Optional on purpose: a missing or empty .env.llm means AI stays OFF (no school mapped) and the service still
      # starts. Template: .env.llm.example. The key is never passed to django, postgres or any other service.
      - path: .env.llm
        required: false
    environment:
      DB_NAME: ${DB_NAME:-school_db}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --workers 2
    depends_on:
      - postgres
    networks:
      - backend

  # ========== Frontends (ADR-0014 apps, containerised per ADR-0015) ==========
  # Built from their own directories: bun install from the lockfile → D6 JS gate (lint/typecheck/tests)
  # → nitro `node-server` build → node:22-alpine runtime on port 3000. No host port: the only route in is
  # the gateway, on the app's own origin (no CORS entry needed).
  frontend_men:
    build: ./frontend-men
    container_name: frontend_men
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - edge

  frontend_women:
    build: ./frontend-women
    container_name: frontend_women
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - edge

  # ========== Edge gateway (ADR-0015) ==========
  # One nginx for both apps: /api/, /admin/, /static/ → django:8000; / → the app named by the Host header.
  # Loopback-bound (D5); the server profile puts the school's TLS proxy in front (docs/DEPLOYMENT.md §3b).
  gateway:
    image: nginx:1.27-alpine
    container_name: frontend_gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_HTTP_PORT:-8080}:80"
    environment:
      - MEN_HOST=${MEN_HOST:-men.localhost}
      - WOMEN_HOST=${WOMEN_HOST:-women.localhost}
    volumes:
      - ./deploy/nginx/frontends.conf:/etc/nginx/templates/frontends.conf.template:ro
      - ./deploy/nginx/eip_proxy.conf:/etc/nginx/eip_proxy.conf:ro
    depends_on:
      frontend_men:
        condition: service_healthy
      frontend_women:
        condition: service_healthy
      django:
        condition: service_started
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ========== Optional hot-reload profile (D3): no image build, source bind-mounted ==========
  # docker compose --profile frontends-dev up -d frontend_men_dev frontend_women_dev
  frontend_men_dev:
    profiles: ["frontends-dev"]
    image: oven/bun:1-alpine
    container_name: frontend_men_dev
    working_dir: /app
    volumes:
      - ./frontend-men:/app
      - frontend_men_modules:/app/node_modules
    environment:
      - VITE_DEV_API_TARGET=http://django:8000
    command: sh -c "bun install --frozen-lockfile && bun run dev --host 0.0.0.0"
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - django
    networks:
      - edge

  frontend_women_dev:
    profiles: ["frontends-dev"]
    image: oven/bun:1-alpine
    container_name: frontend_women_dev
    working_dir: /app
    volumes:
      - ./frontend-women:/app
      - frontend_women_modules:/app/node_modules
    environment:
      - VITE_DEV_API_TARGET=http://django:8000
    command: sh -c "bun install --frozen-lockfile && bun run dev --host 0.0.0.0"
    ports:
      - "127.0.0.1:5174:5174"
    depends_on:
      - django
    networks:
      - edge

  # ========== PostgreSQL (با pgvector برای RAG آینده) ==========
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres_db
    environment:
      POSTGRES_DB: school_db
      # R-04: the bootstrap superuser is used for maintenance only (never by the application). On the FIRST start of an empty data
      # directory deploy/postgres/10-roles.sh creates school_owner (DDL) and school_app (DML). Existing data: docs/DEPLOYMENT.md 4a.
      POSTGRES_USER: school_admin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD is required}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?DB_OWNER_PASSWORD is required}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD is required}
    # No host port: only Django/Celery/FastAPI reach it over the compose network.
    # Admin access: docker compose exec postgres psql -U school_admin -d school_db
    # No env_file: the server needs only the three POSTGRES_* values above (interpolated from
    # .env by Compose), not Django's SECRET_KEY or the service-token secret.
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - backend     # never on `edge`: no frontend/gateway route to the database (ADR-0015)

  # ========== Redis (کش و بروکر Celery) ==========
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    # No host port (no authentication configured): only Django/Celery reach it over the compose network.
    volumes:
      - ./data/redis:/data
    networks:
      - backend

  # ========== MinIO (ذخیره‌سازی فایل - آماده‌سازی برای فاز ۹) ==========
  minio:
    image: minio/minio
    container_name: minio_storage
    # No host port: not used by the application yet (Phase 9). To use the console, bind it to
    # 127.0.0.1 only, e.g. "127.0.0.1:9001:9001".
    volumes:
      - ./data/minio:/data
    env_file:
      - .env.minio   # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD (gitignored, non-default); not .env
    command: server /data --console-address ":9001"
    networks:
      - backend
  

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_server
    ports:
      # Host port 11434 is taken by the system-wide ollama service; containers use "ollama:11434" internally.
      - "127.0.0.1:11435:11434"
    volumes:
      - ./data/ollama:/root/.ollama  # ماندگاری مدل‌ها
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=5m  # مدل را ۵ دقیقه در حافظه نگه دار
    restart: unless-stopped
    command: serve
    networks:
      - backend

# Two networks (ADR-0015 P6 / D4):
#   edge    — gateway ↔ frontends ↔ django. The public-ish side; no database or cache lives here.
#   backend — django ↔ postgres/redis/fastapi/celery/minio/ollama. Frontends are NOT members, so a
#             compromised Next/Node process cannot open a PostgreSQL or Redis socket.
networks:
  edge:
    driver: bridge
  backend:
    driver: bridge

# Named volumes for the optional `frontends-dev` profile only (keep the host tree free of node_modules).
volumes:
  frontend_men_modules:
  frontend_women_modules:
