# سرویس‌های جدید را اضافه کرده و db را جایگزین sqlite می‌کنیم:


services:
  # ========== Django ==========
  django:
    build: ./django_core
    container_name: django_core
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./django_core:/app
      - ./data/static:/app/staticfiles
      - ./data/media:/app/media
    env_file:
      - .env
      - .env.service   # SERVICE_JWT_SECRET (gitignored); shared with FastAPI only
    depends_on:
      - postgres
      - redis
      - fastapi
    command: >
      sh -c "python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 3000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - USE_POSTGRES=True

  # ========== Celery Worker (پردازش پس‌زمینه) ==========
  celery:
    build: ./django_core
    container_name: celery_worker
    volumes:
      - ./django_core:/app
    env_file: .env
    depends_on:
      - postgres
      - redis
    command: celery -A config worker -l info
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production

  # ========== Celery Beat (زمان‌بندی کارها) ==========
  celery_beat:
    build: ./django_core
    container_name: celery_beat
    volumes:
      - ./django_core:/app
    env_file: .env
    depends_on:
      - postgres
      - redis
      - celery
    command: celery -A config beat -l info
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production

  # ========== FastAPI ==========
  fastapi:
    build: ./fastapi_core
    container_name: fastapi_core
    ports:
      # Loopback only: Django reaches FastAPI over the compose network ("fastapi:8001").
      - "127.0.0.1:8001:8001"
    volumes:
      - ./fastapi_core:/app
      - ./data:/data
    # Deliberately NOT env_file: .env -- FastAPI must not receive Django's SECRET_KEY, the Django
    # database owner password, or other Django-only settings.
    env_file:
      - .env.service   # SERVICE_JWT_SECRET (gitignored)
      - .env.fastapi   # DB_USER / DB_PASSWORD of the least-privilege role `fastapi_user` (gitignored)
    environment:
      DB_NAME: ${DB_NAME:-school_db}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --workers 2
    depends_on:
      - postgres

  # ========== PostgreSQL (با pgvector برای RAG آینده) ==========
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres_db
    environment:
      POSTGRES_DB: school_db
      POSTGRES_USER: school_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # No host port: only Django/Celery/FastAPI reach it over the compose network.
    # Admin access: docker compose exec postgres psql -U school_user -d school_db
    # No env_file: the server needs only the three POSTGRES_* values above (interpolated from
    # .env by Compose), not Django's SECRET_KEY or the service-token secret.
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  # ========== Redis (کش و بروکر Celery) ==========
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    # No host port (no authentication configured): only Django/Celery reach it over the compose network.
    volumes:
      - ./data/redis:/data

  # ========== MinIO (ذخیره‌سازی فایل - آماده‌سازی برای فاز ۹) ==========
  minio:
    image: minio/minio
    container_name: minio_storage
    # No host port: not used by the application yet (Phase 9). To use the console, bind it to
    # 127.0.0.1 only, e.g. "127.0.0.1:9001:9001".
    volumes:
      - ./data/minio:/data
    env_file:
      - .env.minio   # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD (gitignored, non-default); not .env
    command: server /data --console-address ":9001"
  

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_server
    ports:
      # Host port 11434 is taken by the system-wide ollama service; containers use "ollama:11434" internally.
      - "127.0.0.1:11435:11434"
    volumes:
      - ./data/ollama:/root/.ollama  # ماندگاری مدل‌ها
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=5m  # مدل را ۵ دقیقه در حافظه نگه دار
    restart: unless-stopped
    command: serve